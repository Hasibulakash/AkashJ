<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Countdown to April 1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 166, 193, .28), transparent 30%),
        radial-gradient(circle at 85% 75%, rgba(255, 105, 145, .22), transparent 32%),
        linear-gradient(135deg, #2b1027 0%, #5b1d3d 42%, #24152f 100%);
      overflow-x: hidden;
    }
    .wrap { width: min(760px, 100%); text-align: center; position: relative; z-index: 1; }
    body::before, body::after {
      content: "♥"; position: fixed; color: rgba(255, 190, 210, .10);
      font-size: clamp(150px, 28vw, 360px); pointer-events: none; line-height: 1;
      animation: float 9s ease-in-out infinite;
    }
    body::before { top: 4%; left: -5%; transform: rotate(-18deg); }
    body::after { right: -5%; bottom: 0; font-size: clamp(180px, 32vw, 420px); animation-delay: -4s; }
    @keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -18px; } }
    .eyebrow { color: #a9b9d8; font-size: .78rem; letter-spacing: .24em; text-transform: uppercase; margin-bottom: 18px; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1.05; margin: 0 0 14px; font-weight: 750; letter-spacing: -.045em; }
    .subtitle { color: #b8c4da; margin: 0 0 42px; font-size: clamp(.95rem, 2vw, 1.1rem); }
    .timer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 3vw, 22px); }
    .unit {
      padding: clamp(18px, 4vw, 30px) 8px 22px; border: 1px solid rgba(190, 210, 255, .17);
      border-radius: 22px; background: rgba(255,255,255,.07); backdrop-filter: blur(12px);
      box-shadow: 0 18px 55px rgba(0,0,0,.22);
    }
    .number { display: block; font-variant-numeric: tabular-nums; font-size: clamp(2.5rem, 9vw, 5.8rem); line-height: 1; font-weight: 750; letter-spacing: -.06em; }
    .label { display: block; margin-top: 14px; color: #aebed9; font-size: .76rem; letter-spacing: .2em; text-transform: uppercase; }
    .footer { color: #71819f; margin-top: 30px; font-size: .8rem; }
    @media (max-width: 420px) { .timer { gap: 8px; } .unit { border-radius: 16px; } .label { letter-spacing: .12em; font-size: .65rem; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">The countdown is on</div>
    <h1>Something begins soon.</h1>
    <section class="timer" aria-label="Time remaining">
      <div class="unit"><span class="number" id="hours">000</span><span class="label">Hours</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>
  </main>
  <script>
    // Uses the visitor's local time zone. The target is midnight at the start of April 1, 2027.
    const target = new Date(2027, 3, 1, 0, 0, 0).getTime();
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');

    function updateCountdown() {
      const remaining = Math.max(0, target - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      hoursEl.textContent = String(hours).padStart(3, '0');
      minutesEl.textContent = String(minutes).padStart(2, '0');
      secondsEl.textContent = String(seconds).padStart(2, '0');

    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
